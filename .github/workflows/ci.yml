name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: async_event_worker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d async_event_worker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        # Same image family as docker-compose.yml. The user is not "guest":
        # RabbitMQ only allows guest on the container loopback, and a GitHub
        # Actions port mapping is a remote address from the broker's side.
        # The suite reads TEST_AMQP_URL (see tests/integration/conftest.py).
        image: rabbitmq:4.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: app
          RABBITMQ_DEFAULT_PASS: app
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    env:
      # 127.0.0.1 avoids a localhost -> ::1 miss on the runner. These are the
      # overrides the integration suite already documents.
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/async_event_worker
      TEST_AMQP_URL: amqp://app:app@127.0.0.1:5672/
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pyproject.toml requires >=3.12,<3.13; the image is python:3.12-slim.
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -q

      - name: Integration tests
        run: |
          python -m pytest -m integration -q -rs --junitxml=integration-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("integration-results.xml").getroot()
          suites = list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if tests == 0 or skipped:
              raise SystemExit(
                  "integration tests did not all run against the service "
                  f"containers (tests={tests}, skipped={skipped}). "
                  "The suite skips when PostgreSQL or RabbitMQ is unreachable; "
                  "that must fail CI."
              )
          PY
