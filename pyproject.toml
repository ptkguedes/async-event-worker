[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-event-worker"
version = "0.1.0"
description = "Arquitetura orientada a eventos com FastAPI, RabbitMQ e PostgreSQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "aio-pika==9.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -m 'not integration'"
markers = ["integration: requer RabbitMQ e PostgreSQL reais"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
# A pasta alembic/ na raiz faria o ruff tratar o pacote alembic como first-party.
known-third-party = ["alembic"]
