[alembic]
script_location = alembic
prepend_sys_path = .
# Separador de prepend_sys_path/version_locations: sem isso o Alembic 1.20 avisa
# que vai usar o modo legado (split por espaco, virgula e dois-pontos).
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# A URL e resolvida em alembic/env.py a partir de Settings (app/core/config.py).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
